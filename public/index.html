<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Support Chat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .chat-shadow {
            box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.05), 0 2px 6px -2px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body class="h-full font-sans antialiased text-slate-800 bg-slate-100 flex flex-col justify-between overflow-hidden">

    <!-- Main Admin Viewport -->
    <main class="w-full h-full flex flex-col justify-between overflow-hidden bg-white max-w-2xl mx-auto shadow-xl sm:border-x sm:border-slate-200 relative">

        <!-- Header Admin -->
        <div class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between shadow-md z-10">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm">
                    A
                </div>
                <div>
                    <h2 class="text-sm font-bold leading-tight">Panneau Administrateur - Support</h2>
                    <p class="text-[11px] text-emerald-400 font-medium flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Connecté au serveur
                    </p>
                </div>
            </div>
        </div>

        <!-- Corps du Chat Admin -->
        <div class="flex-1 flex flex-col overflow-hidden relative bg-[#f8fafc]">
            
            <!-- Fil de discussion -->
            <div id="admin-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="flex justify-center my-1">
                    <span class="text-[10px] font-semibold uppercase tracking-wider bg-slate-200/70 text-slate-600 px-3 py-0.5 rounded-full">Historique des messages</span>
                </div>
            </div>

            <!-- Barre d'envoi Admin -->
            <div class="p-3 bg-white border-t border-slate-200/80">
                <form id="admin-form" class="flex items-center space-x-2">
                    <label class="p-2 text-slate-500 hover:text-blue-600 hover:bg-slate-100 rounded-full transition cursor-pointer" title="Envoyer une image ou vidéo">
                        <i class="fa-solid fa-plus text-sm"></i>
                        <input type="file" id="admin-file-input" style="display: none;" accept="image/*,video/*,audio/*" />
                    </label>
                    
                    <div class="flex-1 flex items-center bg-slate-100 rounded-full px-3 py-1.5 focus-within:bg-white focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500 border border-transparent transition">
                        <input id="admin-msg-input" type="text" placeholder="Répondre au client..." class="w-full bg-transparent text-xs text-slate-800 placeholder-slate-400 focus:outline-none" autocomplete="off">
                    </div>

                    <button type="submit" class="w-9 h-9 bg-blue-600 hover:bg-blue-700 text-white rounded-full flex items-center justify-center shadow-md transition active:scale-95 flex-shrink-0">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
            </div>

        </div>
    </main>

    <!-- Modale de Visionnage Multimédia -->
    <div id="media-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; cursor: pointer;">
        <span id="close-modal" style="position: absolute; top: 20px; right: 30px; color: white; font-size: 2rem; font-weight: bold; cursor: pointer;">&times;</span>
        <div id="modal-content-container"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('admin-form');
        const inputMsg = document.getElementById('admin-msg-input');
        const fileInput = document.getElementById('admin-file-input');
        const messagesUl = document.getElementById('admin-messages');
        const modal = document.getElementById('media-modal');
        const modalContent = document.getElementById('modal-content-container');
        const closeModal = document.getElementById('close-modal');

        function openMediaModal(src, type) {
            modalContent.innerHTML = '';
            if (type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = src;
                img.className = "max-w-[90%] max-h-[90%] rounded-lg shadow-2xl";
                modalContent.appendChild(img);
            } else if (type.startsWith('video/')) {
                const video = document.createElement('video');
                video.src = src;
                video.controls = true;
                video.autoplay = true;
                video.className = "max-w-[90%] max-h-[90%] rounded-lg shadow-2xl";
                modalContent.appendChild(video);
            }
            modal.style.display = 'flex';
        }

        closeModal.onclick = () => { modal.style.display = 'none'; };
        modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = inputMsg.value.trim();
            const file = fileInput.files[0];
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (text || file) {
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        socket.emit('adminMessage', { text: text, file: event.target.result, fileType: file.type });
                        appendMessage('admin', text, event.target.result, file.type, timeStr);
                        resetForm();
                    };
                    reader.readAsDataURL(file);
                } else {
                    socket.emit('adminMessage', { text: text, file: null, fileType: null });
                    appendMessage('admin', text, null, null, timeStr);
                    resetForm();
                }
            }
        });

        function resetForm() {
            inputMsg.value = '';
            fileInput.value = '';
        }

        function appendMessage(sender, text, file, fileType, time) {
            const timeStr = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const isAdmin = sender === 'admin';
            
            const wrapper = document.createElement('div');
            wrapper.className = isAdmin 
                ? "flex items-end justify-end space-x-2 ml-auto max-w-[88%] sm:max-w-[80%]" 
                : "flex items-end space-x-2 max-w-[88%] sm:max-w-[80%]";

            let contentHtml = `<div class="${isAdmin ? "bg-blue-600 text-white p-3 rounded-2xl rounded-br-xs shadow-md space-y-1" : "bg-white p-3 rounded-2xl rounded-bl-xs chat-shadow border border-slate-100 space-y-1"}">`;
            if (text) {
                contentHtml += `<p class="text-xs font-normal leading-relaxed">${escapeHtml(text)}</p>`;
            }

            if (file) {
                if (fileType.startsWith('image/')) {
                    contentHtml += `<div class="rounded-xl overflow-hidden mt-1 cursor-pointer"><img src="${file}" class="w-full h-36 object-cover hover:scale-105 transition duration-300" onclick="openMediaModal('${file}', '${fileType}')"/></div>`;
                } else if (fileType.startsWith('video/')) {
                    contentHtml += `<div class="rounded-xl overflow-hidden mt-1"><video src="${file}" controls class="w-full max-h-40 rounded-lg"></video></div>`;
                } else if (fileType.startsWith('audio/')) {
                    contentHtml += `<div class="mt-1"><audio src="${file}" controls class="w-full max-w-[200px]"></audio></div>`;
                }
            }

            let footerClass = isAdmin ? "flex justify-end items-center space-x-1 text-[10px] text-blue-100/90 pt-0.5" : "flex justify-end text-[10px] text-slate-400 font-medium pt-0.5";
            contentHtml += `<div class="${footerClass}"><span>${timeStr}</span>${isAdmin ? '<i class="fa-solid fa-check text-[11px] text-blue-200 ml-1"></i>' : ''}</div>`;
            contentHtml += `</div>`;

            if (!isAdmin) {
                wrapper.innerHTML = `
                    <div class="w-7 h-7 rounded-full bg-slate-700 text-white flex items-center justify-center font-bold text-xs mb-1 flex-shrink-0 shadow-xs">C</div>
                    <div>${contentHtml}</div>
                `;
            } else {
                wrapper.innerHTML = `<div>${contentHtml}</div>`;
            }

            messagesUl.appendChild(wrapper);
            messagesUl.scrollTop = messagesUl.scrollHeight;
        }

        // Réception des messages envoyés par les clients
        socket.on('clientMessage', (data) => {
            appendMessage('client', data.text, data.file, data.fileType);
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
