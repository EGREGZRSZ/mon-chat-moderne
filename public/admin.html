<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Support Chat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .chat-shadow { box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.05), 0 2px 6px -2px rgba(0, 0, 0, 0.02); }
    </style>
</head>
<body class="h-full font-sans antialiased text-slate-800 bg-slate-100 flex flex-col justify-between overflow-hidden">

    <!-- Notification Toasts -->
    <div id="notification-container" class="fixed top-5 right-5 flex flex-col gap-2 z-50 pointer-events-none"></div>

    <main class="w-full h-full flex bg-white max-w-6xl mx-auto shadow-xl sm:border-x sm:border-slate-200 relative overflow-hidden">
        
        <!-- Sidebar des conversations -->
        <aside class="w-80 bg-white border-r border-slate-200 flex flex-col h-full">
            <div class="bg-slate-900 text-white px-4 py-3 font-bold text-sm flex items-center justify-between">
                <span>Conversations Clients</span>
            </div>
            <ul id="user-list" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                <li class="p-4 text-center text-slate-400 text-xs">Aucun client connecté</li>
            </ul>
        </aside>

        <!-- Espace Chat Principal -->
        <section class="flex-1 flex flex-col h-full bg-[#f8fafc] relative min-w-0">
            <div id="current-chat-title" class="bg-white border-b border-slate-200/80 px-4 py-3 text-sm font-bold text-slate-800 shadow-xs z-10 flex items-center justify-between">
                Sélectionnez une conversation à gauche
            </div>

            <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="flex justify-center my-1">
                    <span class="text-[10px] font-semibold uppercase tracking-wider bg-slate-200/70 text-slate-600 px-3 py-0.5 rounded-full">Historique</span>
                </div>
            </div>

            <div class="p-3 bg-white border-t border-slate-200/80">
                <form id="chat-form" style="display: none;" class="flex items-center space-x-2">
                    <label class="p-2 text-slate-500 hover:text-blue-600 hover:bg-slate-100 rounded-full transition cursor-pointer" title="Envoyer un fichier">
                        <i class="fa-solid fa-plus text-sm"></i>
                        <input type="file" id="file-input" style="display: none;" accept="image/*,video/*" />
                    </label>
                    <button type="button" id="record-btn" class="p-2 text-slate-500 hover:text-blue-600 hover:bg-slate-100 rounded-full transition" title="Message vocal">
                        <i class="fa-solid fa-microphone text-sm"></i>
                    </button>
                    
                    <div class="flex-1 flex items-center bg-slate-100 rounded-full px-3 py-1.5 focus-within:bg-white focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500 border border-transparent transition">
                        <input id="msg-input" type="text" placeholder="Répondre au client..." class="w-full bg-transparent text-xs text-slate-800 placeholder-slate-400 focus:outline-none" autocomplete="off">
                    </div>

                    <button type="submit" class="w-9 h-9 bg-blue-600 hover:bg-blue-700 text-white rounded-full flex items-center justify-center shadow-md transition active:scale-95 flex-shrink-0">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- Modale Multimédia -->
    <div id="media-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; cursor: pointer;">
        <span id="close-modal" style="position: absolute; top: 20px; right: 30px; color: white; font-size: 2rem; font-weight: bold; cursor: pointer;">&times;</span>
        <div id="modal-content-container"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let activeUserId = null;
        let conversations = {};
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const userListUl = document.getElementById('user-list');
        const messagesUl = document.getElementById('messages');
        const chatForm = document.getElementById('chat-form');
        const inputMsg = document.getElementById('msg-input');
        const fileInput = document.getElementById('file-input');
        const recordBtn = document.getElementById('record-btn');
        const chatTitle = document.getElementById('current-chat-title');
        const notifContainer = document.getElementById('notification-container');
        const modal = document.getElementById('media-modal');
        const modalContent = document.getElementById('modal-content-container');
        const closeModal = document.getElementById('close-modal');

        recordBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            if (activeUserId) {
                                socket.emit('adminReply', { targetSocketId: activeUserId, text: '', file: reader.result, fileType: 'audio/webm' });
                            }
                        };
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('text-red-500', 'animate-pulse');
                } catch (err) { alert("Microphone inaccessible."); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('text-red-500', 'animate-pulse');
            }
        };

        function openMediaModal(src, type) {
            modalContent.innerHTML = '';
            if (type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = src; img.className = "max-w-[90%] max-h-[90%] rounded-lg shadow-2xl";
                modalContent.appendChild(img);
            } else if (type.startsWith('video/')) {
                const video = document.createElement('video');
                video.src = src; video.controls = true; video.autoplay = true;
                video.className = "max-w-[90%] max-h-[90%] rounded-lg shadow-2xl";
                modalContent.appendChild(video);
            }
            modal.style.display = 'flex';
        }

        closeModal.onclick = () => modal.style.display = 'none';
        modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

        function showToast(title, text) {
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900 text-white p-3 rounded-xl shadow-xl pointer-events-auto flex flex-col gap-1 min-w-[240px] border-l-4 border-blue-500 text-xs';
            toast.innerHTML = `<strong class="text-blue-400">${title}</strong><span>${text}</span>`;
            notifContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        socket.on('newUserNotification', (data) => { showToast("Nouveau client", `${data.pseudo} vient de se connecter.`); });

        socket.on('updateUserList', (users) => {
            userListUl.innerHTML = '';
            if (users.length === 0) {
                userListUl.innerHTML = '<li class="p-4 text-center text-slate-400 text-xs">Aucun client en ligne</li>';
                return;
            }
            users.forEach(user => {
                if (!conversations[user.id]) conversations[user.id] = [];
                const li = document.createElement('li');
                li.className = `p-3 cursor-pointer transition flex items-center justify-between gap-2 hover:bg-slate-50 ${user.id === activeUserId ? 'bg-blue-50/80 border-l-4 border-blue-600' : ''}`;
                
                li.innerHTML = `
                    <div class="flex items-center space-x-2.5 truncate flex-1">
                        <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs flex-shrink-0">${user.pseudo.charAt(0).toUpperCase()}</div>
                        <div class="truncate">
                            <strong class="block text-xs font-bold text-slate-900 truncate">${user.pseudo}</strong>
                            <div class="text-[11px] text-slate-500 truncate mt-0.5">${user.lastMessage || 'Aucun message'}</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        ${user.unreadCount > 0 ? `<span class="bg-emerald-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-bold">${user.unreadCount}</span>` : ''}
                        <button class="delete-btn text-slate-400 hover:text-red-500 p-1 text-xs" title="Supprimer"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;

                li.onclick = () => selectUser(user.id, user.pseudo);
                li.querySelector('.delete-btn').onclick = (e) => {
                    e.stopPropagation();
                    if (confirm(`Supprimer la conversation avec ${user.pseudo} ?`)) {
                        socket.emit('deleteConversation', user.id);
                        delete conversations[user.id];
                        if (activeUserId === user.id) {
                            activeUserId = null;
                            chatTitle.textContent = "Sélectionnez une conversation à gauche";
                            messagesUl.innerHTML = '';
                            chatForm.style.display = 'none';
                        }
                    }
                };
                userListUl.appendChild(li);
            });
        });

        function selectUser(userId, pseudo) {
            activeUserId = userId;
            chatTitle.innerHTML = `<span class="truncate">Discussion avec ${pseudo}</span>`;
            chatForm.style.display = 'flex';
            socket.emit('markAsRead', userId);
            renderMessages();
        }

        socket.on('newClientMessage', (data) => {
            if (!conversations[data.senderId]) conversations[data.senderId] = [];
            conversations[data.senderId].push({ author: data.author, text: data.text, file: data.file, fileType: data.fileType, type: 'client' });
            if (activeUserId === data.senderId) renderMessages();
            else showToast(`Message de ${data.author}`, data.text || '[Média]');
        });

        socket.on('adminReplySent', (data) => {
            if (!conversations[data.targetSocketId]) conversations[data.targetSocketId] = [];
            conversations[data.targetSocketId].push({ author: data.author, text: data.text, file: data.file, fileType: data.fileType, type: 'admin' });
            if (activeUserId === data.targetSocketId) renderMessages();
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = inputMsg.value.trim();
            const file = fileInput.files[0];
            if ((text || file) && activeUserId) {
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        socket.emit('adminReply', { targetSocketId: activeUserId, text, file: event.target.result, fileType: file.type });
                        resetForm();
                    };
                    reader.readAsDataURL(file);
                } else {
                    socket.emit('adminReply', { targetSocketId: activeUserId, text, file: null, fileType: null });
                    resetForm();
                }
            }
        });

        function resetForm() { inputMsg.value = ''; fileInput.value = ''; }

        function renderMessages() {
            messagesUl.innerHTML = '';
            const msgs = conversations[activeUserId] || [];
            msgs.forEach(m => {
                const isAdmin = m.type === 'admin';
                const wrapper = document.createElement('div');
                wrapper.className = isAdmin ? "flex items-end justify-end space-x-2 ml-auto max-w-[88%] sm:max-w-[80%]" : "flex items-end space-x-2 max-w-[88%] sm:max-w-[80%]";

                let contentHtml = `<div class="${isAdmin ? "bg-blue-600 text-white p-3 rounded-2xl rounded-br-xs shadow-md space-y-1" : "bg-white p-3 rounded-2xl rounded-bl-xs chat-shadow border border-slate-100 space-y-1"}">`;
                if (m.text) contentHtml += `<p class="text-xs font-normal leading-relaxed">${m.text}</p>`;

                if (m.file) {
                    if (m.fileType.startsWith('image/')) {
                        contentHtml += `<div class="rounded-xl overflow-hidden mt-1 cursor-pointer"><img src="${m.file}" class="w-full h-36 object-cover hover:scale-105 transition duration-300" onclick="openMediaModal('${m.file}', '${m.fileType}')"/></div>`;
                    } else if (m.fileType.startsWith('video/')) {
                        contentHtml += `<div class="rounded-xl overflow-hidden mt-1"><video src="${m.file}" controls class="w-full max-h-40 rounded-lg"></video></div>`;
                    } else if (m.fileType.startsWith('audio/')) {
                        contentHtml += `<div class="mt-1"><audio src="${m.file}" controls class="w-full max-w-[200px]"></audio></div>`;
                    }
                }
                contentHtml += `<div class="flex justify-end items-center space-x-1 text-[10px] ${isAdmin ? 'text-blue-100/90' : 'text-slate-400'} pt-0.5"><span>${m.time}</span></div></div>`;

                if (!isAdmin) {
                    wrapper.innerHTML = `<div class="w-7 h-7 rounded-full bg-slate-700 text-white flex items-center justify-center font-bold text-xs mb-1 flex-shrink-0 shadow-xs">C</div><div>${contentHtml}</div>`;
                } else {
                    wrapper.innerHTML = `<div>${contentHtml}</div>`;
                }
                messagesUl.appendChild(wrapper);
            });
            messagesUl.scrollTop = messagesUl.scrollHeight;
        }
    </script>
</body>
</html>
